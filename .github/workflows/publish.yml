name: CI / Publish

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm --filter enhanced-video-sveltekit check

      - name: Build
        run: pnpm --filter enhanced-video-sveltekit build

      - name: Verify tarball contents
        working-directory: packages/enhanced-video
        run: npm pack --dry-run

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check if version is new
        id: check
        working-directory: packages/enhanced-video
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "name=$PKG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null | grep -q .; then
            echo "$PKG_NAME@$PKG_VERSION already published — skipping"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will publish $PKG_NAME@$PKG_VERSION"
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.check.outputs.should_publish == 'true'
        working-directory: packages/enhanced-video
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --no-git-checks --provenance

      - name: Generate full changelog
        if: steps.check.outputs.should_publish == 'true'
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.check.outputs.version }}
        env:
          OUTPUT: packages/enhanced-video/CHANGELOG.md

      - name: Generate release notes (this version only)
        if: steps.check.outputs.should_publish == 'true'
        id: release_notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ steps.check.outputs.version }} --unreleased --strip header

      - name: Commit updated CHANGELOG and tag
        if: steps.check.outputs.should_publish == 'true'
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/enhanced-video/CHANGELOG.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(changelog): release $TAG [skip ci]"
            git push origin HEAD:main
          fi
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        if: steps.check.outputs.should_publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.check.outputs.version }}" \
            --title "v${{ steps.check.outputs.version }}" \
            --notes "${{ steps.release_notes.outputs.content }}"
